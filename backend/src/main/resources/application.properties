spring.application.name=backend
spring.web.error.include-message=always
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/notafacildb?sslmode=disable}
spring.datasource.username=postgres
spring.datasource.password=admin123
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
jwt.secret=${JWT_SECRET:notafacil-default-dev-secret-change-this-in-production-32b}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
spring.mail.host=${MAIL_HOST:in-v3.mailjet.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAILJET_API_KEY:}
spring.mail.password=${MAILJET_SECRET_KEY:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
app.mail.from=${MAIL_FROM:}
app.reset-password-url=${APP_RESET_PASSWORD_URL:http://localhost:5173/reset-password?token=}
app.reset-token.expiration-ms=${RESET_TOKEN_EXPIRATION_MS:900000}
